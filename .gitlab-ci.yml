stages:
  - test
  - build
  - mend

test:
  stage: test
  image: golang:1.24
  tags:
    - docker
  script:
    - |
      go mod tidy
      go test -cover -coverprofile="coverage.out" ./...
  artifacts:
    paths:
      - coverage.out

sonar:
  stage: test
  needs:
    - test
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  only:
    - develop
    - /^release/
  script:
    - sonar-scanner -Dsonar.host.url=${SONAR_HOST} -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.projectName=${SONAR_PROJECT_NAME} -Dsonar.branch.name=${CI_COMMIT_BRANCH} -Dsonar.login=${SONAR_LOGIN_TOKEN}
  allow_failure: true

build_and_push_latest_image:
  stage: build
  only:
    - develop
  variables:
    IMAGE_TAG: "latest"
  script:
    - |
      docker image prune -f
      docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
      docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
      docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG
      docker logout $DOCKER_REPOSITORY

build_and_push_alfa_image:
  stage: build
  only:
    - /^release/
  script:
    - |
      export IMAGE_TAG=$(echo $CI_COMMIT_BRANCH | cut -c 9-)-alfa
      docker image prune -f
      docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
      docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
      docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG
      docker logout $DOCKER_REPOSITORY

build_and_push_release_image:
  stage: build
  only:
    - tags
  script:
    - |
      export IMAGE_TAG=$(echo $CI_COMMIT_TAG | cut -c 2-)
      docker image prune -f
      docker login -u $DOCKER_USERNAME -p $DOCKER_PASSWORD $DOCKER_REPOSITORY
      docker build -t $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG .
      docker push $DOCKER_REPOSITORY_LOCAL:$IMAGE_TAG
      docker logout $DOCKER_REPOSITORY

mend:
  stage: mend
  image: openjdk:21-jdk-slim
  only:
    - /^release/
  variables:
    PRODUCT_NAME: "nmaas"
    PROJECT_NAME: "nmaas-janitor"
  script:
    - |
      export PRODUCT_VERSION=$(echo $CI_COMMIT_BRANCH | cut -c 9-)
      export PROJECT_VERSION=$PRODUCT_VERSION
      apt-get update && apt-get install -y curl
      curl -LJO https://github.com/whitesource/unified-agent-distribution/releases/latest/download/wss-unified-agent.jar
      curl -LJO https://go.dev/dl/go1.24.4.linux-amd64.tar.gz
      tar -C /usr/local -xzf go1.24.4.linux-amd64.tar.gz
      export PATH=$PATH:/usr/local/go/bin
      go version
      java -jar wss-unified-agent.jar -userKey ${MEND_USER_KEY} -apiKey ${MEND_API_KEY} -projectVersion ${PROJECT_VERSION} -project ${PROJECT_NAME} -productVersion ${PRODUCT_VERSION} -product ${PRODUCT_NAME} -c ./ws/ws.config -d ./